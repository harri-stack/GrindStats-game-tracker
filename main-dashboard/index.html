<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" sizes="32x32" href="../favicon-32x32.png">
    <link rel="stylesheet" href="Style.css">
    <title>GrindStats - Dashboard</title>
</head>
<body>
    <h1 class="welcome-message"></h1>
    <div class="game-tracking">
        <h2 class="secondary-header">Track your games here</h2>
        <p class="supported-games">Supported games:</p>
    </div>

    <div class="available-games">
        <div class="game-card rocket-league">
            <button class="select-rocket-league">Select game →</button>
        </div>

        <div class="game-card placeholder-game">
            <button class="select-placeholder">Select game →</button>
        </div>

        <div class="game-card placeholder-game2">
            <button class="select-placeholder2">Select game →</button>
        </div>

        <div class="game-card placeholder-game3">
            <button class="select-placeholder3">Select game →</button>
        </div>

        <div class="game-card placeholder-game4">
            <button class="select-placeholder4">Select game →</button>
        </div>

        <div class="game-card placeholder-game5">
            <button class="select-placeholder5">Select game →</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
