<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="Style.css">
    <title>GrindStats - Track Your Progress</title>
</head>
<body>
    <header class="navbar">

        <a href="#" class="logo">GrindStats</a>

        <div class="nav-buttons">
            <button class="login-button">Login</button>
            <button class="signup-button">Sign Up</button>
        </div>
    </header>

    <main>

        <section class="hero">

            <p class="eyebrow">YOUR MATCH. YOUR STATS.</p>

            <h1 class="hero-title">EVERY GAME MATTERS</h1>

            <p class = "hero-description">Track your gaming progress and performance with GrindStats. See how far you've come</p>

            <button class="primary-button">Get Started →</button>
        </section>

        <section class="features">

            <article class="feature-card">
                <h2 class="feature-title">Multiple games</h2>
                <p class="feature-description">All of your stats, together.</p>
            </article>

            <article class="feature-card">
                <h2 class="feature-title">Track your progress</h2>
                <p class="feature-description">See how far you've come.</p>
            </article>
        </section>

    </main>

    <footer class= "footer">
        <p>© 2026 GrindStats. All rights reserved.</p>
    </footer>

    <script src="Script.js"></script>
</body>
</html>
